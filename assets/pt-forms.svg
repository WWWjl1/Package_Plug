<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="100%" role="img" aria-label="封装引出的三种几何形态与引脚数上限，以及同样 208 引脚下 QFP 与 PBGA 的占板面积对比">
  <defs>
    <linearGradient id="ptBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#d7e0ec"/>
    </linearGradient>
    <linearGradient id="ptQfp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f5f9"/>
      <stop offset="1" stop-color="#ccd6e2"/>
    </linearGradient>
    <linearGradient id="ptBga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4edf8"/>
      <stop offset="1" stop-color="#b9cbe2"/>
    </linearGradient>
  </defs>

  <text x="24" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#8b97a8">① 引出的几何：三种形态决定引脚数上限</text>
  <text x="450" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#8b97a8">② 同样 208 引脚：QFP 与 PBGA 的占板面积</text>

  <!-- ==================== ①-1 两侧引出 ==================== -->
  <rect x="58" y="72" width="60" height="80" fill="url(#ptBody)" stroke="#4a5666" stroke-width="1.5"/>
  <g fill="#8f9db2" stroke="#66748a" stroke-width="0.8">
    <rect x="50" y="78" width="8" height="6"/><rect x="50" y="92" width="8" height="6"/>
    <rect x="50" y="106" width="8" height="6"/><rect x="50" y="120" width="8" height="6"/>
    <rect x="50" y="134" width="8" height="6"/><rect x="50" y="148" width="8" height="6"/>
    <rect x="118" y="78" width="8" height="6"/><rect x="118" y="92" width="8" height="6"/>
    <rect x="118" y="106" width="8" height="6"/><rect x="118" y="120" width="8" height="6"/>
    <rect x="118" y="134" width="8" height="6"/><rect x="118" y="148" width="8" height="6"/>
  </g>
  <text x="88" y="117" font-family="system-ui,sans-serif" font-size="11" fill="#8b97a8" text-anchor="middle">两侧</text>
  <text x="88" y="176" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#4a5666" text-anchor="middle">DIP / SOP</text>
  <text x="88" y="193" font-family="system-ui,sans-serif" font-size="11" fill="#4a8fd0" text-anchor="middle">N ≈ 2L / p</text>
  <text x="88" y="209" font-family="system-ui,sans-serif" font-size="11" fill="#6b7a8d" text-anchor="middle">120 个位置</text>

  <!-- ==================== ①-2 四侧引出 ==================== -->
  <rect x="188" y="72" width="60" height="80" fill="url(#ptBody)" stroke="#4a5666" stroke-width="1.5"/>
  <g fill="#8f9db2" stroke="#66748a" stroke-width="0.8">
    <rect x="196" y="64" width="7" height="8"/><rect x="208" y="64" width="7" height="8"/>
    <rect x="220" y="64" width="7" height="8"/><rect x="232" y="64" width="7" height="8"/>
    <rect x="196" y="152" width="7" height="8"/><rect x="208" y="152" width="7" height="8"/>
    <rect x="220" y="152" width="7" height="8"/><rect x="232" y="152" width="7" height="8"/>
    <rect x="180" y="80" width="8" height="7"/><rect x="180" y="94" width="8" height="7"/>
    <rect x="180" y="108" width="8" height="7"/><rect x="180" y="122" width="8" height="7"/>
    <rect x="180" y="136" width="8" height="7"/><rect x="180" y="150" width="8" height="7"/>
    <rect x="248" y="80" width="8" height="7"/><rect x="248" y="94" width="8" height="7"/>
    <rect x="248" y="108" width="8" height="7"/><rect x="248" y="122" width="8" height="7"/>
    <rect x="248" y="136" width="8" height="7"/><rect x="248" y="150" width="8" height="7"/>
  </g>
  <text x="218" y="117" font-family="system-ui,sans-serif" font-size="11" fill="#8b97a8" text-anchor="middle">四侧</text>
  <text x="218" y="176" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#4a5666" text-anchor="middle">QFP / QFN</text>
  <text x="218" y="193" font-family="system-ui,sans-serif" font-size="11" fill="#4a8fd0" text-anchor="middle">N ≈ 4L / p</text>
  <text x="218" y="209" font-family="system-ui,sans-serif" font-size="11" fill="#6b7a8d" text-anchor="middle">240 个位置</text>

  <!-- ==================== ①-3 面阵引出 ==================== -->
  <rect x="298" y="70" width="86" height="86" fill="url(#ptBody)" stroke="#4a5666" stroke-width="1.5"/>
  <g fill="#c7d0dc" stroke="#8b97a8" stroke-width="1">
    <circle cx="310" cy="82" r="4.6"/><circle cx="323" cy="82" r="4.6"/><circle cx="336" cy="82" r="4.6"/><circle cx="349" cy="82" r="4.6"/><circle cx="362" cy="82" r="4.6"/><circle cx="375" cy="82" r="4.6"/>
    <circle cx="310" cy="95" r="4.6"/><circle cx="323" cy="95" r="4.6"/><circle cx="336" cy="95" r="4.6"/><circle cx="349" cy="95" r="4.6"/><circle cx="362" cy="95" r="4.6"/><circle cx="375" cy="95" r="4.6"/>
    <circle cx="310" cy="108" r="4.6"/><circle cx="323" cy="108" r="4.6"/><circle cx="336" cy="108" r="4.6"/><circle cx="349" cy="108" r="4.6"/><circle cx="362" cy="108" r="4.6"/><circle cx="375" cy="108" r="4.6"/>
    <circle cx="310" cy="121" r="4.6"/><circle cx="323" cy="121" r="4.6"/><circle cx="336" cy="121" r="4.6"/><circle cx="349" cy="121" r="4.6"/><circle cx="362" cy="121" r="4.6"/><circle cx="375" cy="121" r="4.6"/>
    <circle cx="310" cy="134" r="4.6"/><circle cx="323" cy="134" r="4.6"/><circle cx="336" cy="134" r="4.6"/><circle cx="349" cy="134" r="4.6"/><circle cx="362" cy="134" r="4.6"/><circle cx="375" cy="134" r="4.6"/>
    <circle cx="310" cy="147" r="4.6"/><circle cx="323" cy="147" r="4.6"/><circle cx="336" cy="147" r="4.6"/><circle cx="349" cy="147" r="4.6"/><circle cx="362" cy="147" r="4.6"/><circle cx="375" cy="147" r="4.6"/>
  </g>
  <text x="341" y="176" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#4a5666" text-anchor="middle">BGA / WLCSP</text>
  <text x="341" y="193" font-family="system-ui,sans-serif" font-size="11" fill="#4a8fd0" text-anchor="middle">N ≈ (L / p)²</text>
  <text x="341" y="209" font-family="system-ui,sans-serif" font-size="11" fill="#6b7a8d" text-anchor="middle">3600 个位置</text>

  <!-- 左栏说明（宽度控制在 x < 300，避开右栏） -->
  <text x="24" y="232" font-family="system-ui,sans-serif" font-size="10.5" fill="#8b97a8">同一跨度 L = 30 mm、节距 p = 0.5 mm</text>
  <text x="24" y="248" font-family="system-ui,sans-serif" font-size="10.5" fill="#8b97a8">理论上限：120 → 240 → 3600</text>
  <text x="24" y="264" font-family="system-ui,sans-serif" font-size="10.5" fill="#8b97a8">倍数 = L / (4p) = 15，纯几何结论</text>
  <text x="24" y="280" font-family="system-ui,sans-serif" font-size="10.5" fill="#8b97a8">面阵实际节距 1.0 mm，真实差距 2 ～ 4 倍</text>

  <!-- ==================== ② QFP-208（按 1 mm = 4.5 px） ==================== -->
  <rect x="466" y="66" width="135" height="135" fill="url(#ptQfp)" stroke="#4a5666" stroke-width="1.5"/>
  <rect x="470.5" y="70.5" width="126" height="126" fill="#eef2f7" stroke="#8b97a8" stroke-width="0.9"/>
  <g stroke="#66748a" stroke-width="1.4">
    <line x1="466" y1="80" x2="470.5" y2="80"/><line x1="466" y1="95" x2="470.5" y2="95"/>
    <line x1="466" y1="110" x2="470.5" y2="110"/><line x1="466" y1="125" x2="470.5" y2="125"/>
    <line x1="466" y1="140" x2="470.5" y2="140"/><line x1="466" y1="155" x2="470.5" y2="155"/>
    <line x1="466" y1="170" x2="470.5" y2="170"/><line x1="466" y1="185" x2="470.5" y2="185"/>
    <line x1="596.5" y1="80" x2="601" y2="80"/><line x1="596.5" y1="95" x2="601" y2="95"/>
    <line x1="596.5" y1="110" x2="601" y2="110"/><line x1="596.5" y1="125" x2="601" y2="125"/>
    <line x1="596.5" y1="140" x2="601" y2="140"/><line x1="596.5" y1="155" x2="601" y2="155"/>
    <line x1="596.5" y1="170" x2="601" y2="170"/><line x1="596.5" y1="185" x2="601" y2="185"/>
    <line x1="480" y1="66" x2="480" y2="70.5"/><line x1="495" y1="66" x2="495" y2="70.5"/>
    <line x1="510" y1="66" x2="510" y2="70.5"/><line x1="525" y1="66" x2="525" y2="70.5"/>
    <line x1="540" y1="66" x2="540" y2="70.5"/><line x1="555" y1="66" x2="555" y2="70.5"/>
    <line x1="570" y1="66" x2="570" y2="70.5"/><line x1="585" y1="66" x2="585" y2="70.5"/>
    <line x1="480" y1="196.5" x2="480" y2="201"/><line x1="495" y1="196.5" x2="495" y2="201"/>
    <line x1="510" y1="196.5" x2="510" y2="201"/><line x1="525" y1="196.5" x2="525" y2="201"/>
    <line x1="540" y1="196.5" x2="540" y2="201"/><line x1="555" y1="196.5" x2="555" y2="201"/>
    <line x1="570" y1="196.5" x2="570" y2="201"/><line x1="585" y1="196.5" x2="585" y2="201"/>
  </g>

  <!-- ==================== ② PBGA-208 ==================== -->
  <rect x="628" y="82" width="103.5" height="103.5" fill="url(#ptBga)" stroke="#4a5666" stroke-width="1.5"/>
  <g fill="#c7d0dc" stroke="#8b97a8" stroke-width="0.9">
    <circle cx="636" cy="90" r="4.4"/><circle cx="650" cy="90" r="4.4"/><circle cx="664" cy="90" r="4.4"/><circle cx="678" cy="90" r="4.4"/><circle cx="692" cy="90" r="4.4"/><circle cx="706" cy="90" r="4.4"/>
    <circle cx="636" cy="104" r="4.4"/><circle cx="650" cy="104" r="4.4"/><circle cx="664" cy="104" r="4.4"/><circle cx="678" cy="104" r="4.4"/><circle cx="692" cy="104" r="4.4"/><circle cx="706" cy="104" r="4.4"/>
    <circle cx="636" cy="118" r="4.4"/><circle cx="650" cy="118" r="4.4"/><circle cx="664" cy="118" r="4.4"/><circle cx="678" cy="118" r="4.4"/><circle cx="692" cy="118" r="4.4"/><circle cx="706" cy="118" r="4.4"/>
    <circle cx="636" cy="132" r="4.4"/><circle cx="650" cy="132" r="4.4"/><circle cx="664" cy="132" r="4.4"/><circle cx="678" cy="132" r="4.4"/><circle cx="692" cy="132" r="4.4"/><circle cx="706" cy="132" r="4.4"/>
    <circle cx="636" cy="146" r="4.4"/><circle cx="650" cy="146" r="4.4"/><circle cx="664" cy="146" r="4.4"/><circle cx="678" cy="146" r="4.4"/><circle cx="692" cy="146" r="4.4"/><circle cx="706" cy="146" r="4.4"/>
    <circle cx="636" cy="160" r="4.4"/><circle cx="650" cy="160" r="4.4"/><circle cx="664" cy="160" r="4.4"/><circle cx="678" cy="160" r="4.4"/><circle cx="692" cy="160" r="4.4"/><circle cx="706" cy="160" r="4.4"/>
  </g>

  <!-- 右栏标注：各自左对齐到本方框左边缘，避免互相重叠 -->
  <text x="466" y="218" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#4a5666">LQFP-208</text>
  <text x="466" y="233" font-family="system-ui,sans-serif" font-size="10" fill="#6b7a8d">30 × 30 mm ＝ 900 mm²</text>
  <text x="466" y="247" font-family="system-ui,sans-serif" font-size="10" fill="#6b7a8d">节距 0.5 mm｜共面性 ≤ 0.08 mm</text>

  <text x="628" y="218" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#4a5666">PBGA-208</text>
  <text x="628" y="233" font-family="system-ui,sans-serif" font-size="10" fill="#6b7a8d">23 × 23 mm ＝ 529 mm²</text>
  <text x="628" y="247" font-family="system-ui,sans-serif" font-size="10" fill="#6b7a8d">节距 1.0 mm｜共面性 ≤ 0.15 mm</text>

  <line x1="466" y1="262" x2="731.5" y2="262" stroke="#9aa7b8" stroke-width="1.1"/>
  <text x="466" y="280" font-family="system-ui,sans-serif" font-size="10.5" fill="#4a8fd0">引脚密度 0.23 → 0.39 个/mm²（1.7 倍），占板省 41%</text>
  <text x="466" y="296" font-family="system-ui,sans-serif" font-size="10.5" fill="#4a8fd0">节距反而粗一倍、共面性规格反而更松——这就是引出维度的威力</text>

  <!-- 全图注 -->
  <text x="24" y="322" font-family="system-ui,sans-serif" font-size="10.5" fill="#8b97a8">引脚数上限只与跨度 L 和节距 p 有关；面积对比按 1 mm = 4.5 px 同比例绘制</text>
</svg>
