<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" role="img" aria-label="引线键合剖面示意图">
  <defs>
    <linearGradient id="dieG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9db3d0"/>
      <stop offset="1" stop-color="#5d7699"/>
    </linearGradient>
    <linearGradient id="subG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8b9e"/>
      <stop offset="1" stop-color="#59657a"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="330" fill="none"/>

  <!-- 基板 / 引线框架 -->
  <rect x="40" y="248" width="640" height="46" rx="4" fill="url(#subG)" stroke="#4a5666" stroke-width="1.5"/>
  <text x="360" y="277" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">基板 / 引线框架 (Substrate / Lead Frame)</text>

  <!-- 芯片 -->
  <rect x="90" y="178" width="220" height="70" rx="2" fill="url(#dieG)" stroke="#4a5666" stroke-width="1.5"/>
  <text x="200" y="219" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">芯片 Die (Si)</text>

  <!-- 铝焊盘 -->
  <rect x="148" y="169" width="78" height="9" rx="2" fill="#dfe5ee" stroke="#93a1b5" stroke-width="1"/>

  <!-- 基板焊盘 -->
  <rect x="496" y="240" width="86" height="9" rx="2" fill="#dfe5ee" stroke="#93a1b5" stroke-width="1"/>

  <!-- 键合线 -->
  <path d="M187,158 C 236,52 470,52 540,232" fill="none" stroke="#d9a441" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 第一焊点 -->
  <ellipse cx="187" cy="158" rx="23" ry="14" fill="#e0b055" stroke="#a97c1f" stroke-width="1.5"/>
  <!-- 第二焊点 -->
  <ellipse cx="540" cy="232" rx="28" ry="10" fill="#e0b055" stroke="#a97c1f" stroke-width="1.5"/>

  <!-- 标注：球颈 -->
  <line x1="100" y1="112" x2="176" y2="144" stroke="#9aa7b8" stroke-width="1.2" marker-end="url(#arw)"/>
  <text x="18" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#8b97a8">球颈 Neck</text>

  <!-- 标注：第一焊点 -->
  <line x1="120" y1="336" x2="176" y2="170" stroke="#9aa7b8" stroke-width="1.2" marker-end="url(#arw)" opacity="0"/>
  <text x="150" y="140" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#8b97a8" text-anchor="middle" opacity="0">x</text>

  <!-- 标注：铝焊盘 -->
  <line x1="96" y1="196" x2="146" y2="174" stroke="#9aa7b8" stroke-width="1.2" marker-end="url(#arw)"/>
  <text x="8" y="206" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#8b97a8">铝焊盘 Al Pad</text>

  <!-- 标注：弧线 -->
  <line x1="352" y1="24" x2="352" y2="44" stroke="#9aa7b8" stroke-width="1.2" marker-end="url(#arw)"/>
  <text x="352" y="18" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#8b97a8" text-anchor="middle">弧线 Loop（拱高、不能碰邻近的线）</text>

  <!-- 标注：第二焊点 -->
  <line x1="600" y1="182" x2="556" y2="222" stroke="#9aa7b8" stroke-width="1.2" marker-end="url(#arw)"/>
  <text x="608" y="178" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#8b97a8">第二焊点 楔焊 Stitch Bond</text>

  <!-- 标注：第一焊点名字 -->
  <text x="187" y="300" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#8b97a8" text-anchor="middle" opacity="0">x</text>
  <line x1="187" y1="228" x2="187" y2="176" stroke="#9aa7b8" stroke-width="1.2" marker-end="url(#arw)" opacity="0"/>

  <!-- 第一焊点文字（放左下空白） -->
  <line x1="290" y1="330" x2="200" y2="166" stroke="#9aa7b8" stroke-width="1.2" marker-end="url(#arw)"/>
  <text x="288" y="326" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#8b97a8">第一焊点 球焊 Ball Bond</text>
</svg>
