<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="100%" role="img" aria-label="回流焊温度曲线四段示意">
  <defs>
    <marker id="bmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/>
    </marker>
  </defs>

  <text x="24" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#8b97a8">回流焊温度曲线：预热 → 浸润 → 回流 → 冷却（示意，SAC305）</text>

  <!-- 四个温区底色 -->
  <rect x="70" y="50" width="201" height="230" fill="#4a8fd0" opacity="0.07"/>
  <rect x="271" y="50" width="201" height="230" fill="#9db3d0" opacity="0.16"/>
  <rect x="472" y="50" width="154" height="230" fill="#e06c6c" opacity="0.08"/>
  <rect x="626" y="50" width="114" height="230" fill="#4a8fd0" opacity="0.07"/>

  <!-- 坐标轴 -->
  <line x1="70" y1="50" x2="70" y2="280" stroke="#8b97a8" stroke-width="1.2"/>
  <line x1="70" y1="280" x2="740" y2="280" stroke="#8b97a8" stroke-width="1.2"/>

  <!-- 横向网格 -->
  <g stroke="#dfe5ee" stroke-width="1">
    <line x1="70" y1="238.9" x2="740" y2="238.9"/>
    <line x1="70" y1="197.9" x2="740" y2="197.9"/>
    <line x1="70" y1="156.8" x2="740" y2="156.8"/>
    <line x1="70" y1="115.7" x2="740" y2="115.7"/>
    <line x1="70" y1="74.6" x2="740" y2="74.6"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="11.5" fill="#8b97a8" text-anchor="end">
    <text x="62" y="243">50</text>
    <text x="62" y="202">100</text>
    <text x="62" y="161">150</text>
    <text x="62" y="120">200</text>
    <text x="62" y="79">250</text>
  </g>
  <text x="26" y="48" font-family="system-ui,sans-serif" font-size="12.5" fill="#8b97a8">温度 °C</text>

  <!-- 液相线 217 °C -->
  <line x1="70" y1="101.8" x2="740" y2="101.8" stroke="#4a8fd0" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="108" y="95" font-family="system-ui,sans-serif" font-size="12.5" fill="#4a8fd0">SAC305 液相线约 217 °C</text>

  <!-- 温度曲线 -->
  <polyline points="70,259.5 271,156.8 405,132.1 472,115.7 561,78.8 600,78.8 740,200"
            fill="none" stroke="#e06c6c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 峰值标注 -->
  <line x1="561" y1="78.8" x2="561" y2="60" stroke="#e06c6c" stroke-width="1.2"/>
  <text x="440" y="56" font-family="system-ui,sans-serif" font-size="12.5" fill="#e06c6c">峰值 235～250 °C ≈ 液相线 + 20～30 °C</text>
  <circle cx="561" cy="78.8" r="3.4" fill="#e06c6c"/>

  <!-- 液相线以上时间 TAL -->
  <line x1="489" y1="120" x2="626" y2="120" stroke="#4a8fd0" stroke-width="1.3" marker-start="url(#bmArrow)" marker-end="url(#bmArrow)"/>
  <text x="500" y="136" font-family="system-ui,sans-serif" font-size="12.5" fill="#4a8fd0">液相线以上（TAL）60～90 s</text>

  <!-- 升温速率 / 冷却速率 -->
  <text x="92" y="228" font-family="system-ui,sans-serif" font-size="12.5" fill="#8b97a8">升温 1～3 °C/s</text>
  <text x="92" y="245" font-family="system-ui,sans-serif" font-size="12" fill="#8b97a8">避免热冲击</text>
  <text x="646" y="176" font-family="system-ui,sans-serif" font-size="12.5" fill="#8b97a8">冷却 ≤ 3 °C/s</text>
  <text x="646" y="193" font-family="system-ui,sans-serif" font-size="12" fill="#8b97a8">过快 → 动态翘曲 / HIP</text>

  <!-- 温区名 -->
  <g font-family="system-ui,sans-serif" font-size="12.5" fill="#5d7699" text-anchor="middle">
    <text x="170" y="274">预热</text>
    <text x="371" y="274">浸润 / 保温</text>
    <text x="549" y="274">回流</text>
    <text x="683" y="274">冷却</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="11.5" fill="#8b97a8" text-anchor="middle">
    <text x="170" y="292">室温→150 °C</text>
    <text x="371" y="292">150～200 °C</text>
    <text x="549" y="292">＞217 °C</text>
    <text x="683" y="292">降至室温</text>
  </g>

  <!-- 时间轴刻度 -->
  <g font-family="system-ui,sans-serif" font-size="11.5" fill="#8b97a8" text-anchor="middle">
    <text x="70" y="308">0</text>
    <text x="204" y="308">60</text>
    <text x="338" y="308">120</text>
    <text x="472" y="308">180</text>
    <text x="606" y="308">240</text>
    <text x="740" y="308">300</text>
  </g>
  <text x="405" y="326" font-family="system-ui,sans-serif" font-size="12" fill="#8b97a8" text-anchor="middle">时间（s）</text>
</svg>
