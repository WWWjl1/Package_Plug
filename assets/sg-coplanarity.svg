<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="100%" role="img" aria-label="引脚共面性定义与成型半径应变示意">
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d81a0"/>
      <stop offset="1" stop-color="#44526a"/>
    </linearGradient>
    <linearGradient id="leadG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8b07a"/>
      <stop offset="1" stop-color="#9a8347"/>
    </linearGradient>
    <linearGradient id="bandG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8b07a"/>
      <stop offset="1" stop-color="#8d7433"/>
    </linearGradient>
    <marker id="sgArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e06c6c"/>
    </marker>
    <marker id="sgArrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/>
    </marker>
  </defs>

  <text x="24" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#8b97a8">① 共面性（coplanarity）：坐靠面由三个最低点确定</text>
  <text x="430" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#8b97a8">② 成型半径与外侧纤维应变</text>

  <!-- ========== 左：共面性 ========== -->
  <rect x="80" y="56" width="290" height="74" rx="6" fill="url(#bodyG)" stroke="#37415a" stroke-width="1.5"/>
  <text x="225" y="90" font-family="system-ui,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">封装体（塑封料）</text>
  <text x="225" y="110" font-family="system-ui,sans-serif" font-size="12" fill="#c7d2e2" text-anchor="middle">外引脚一排（示意正视）</text>

  <!-- 引脚 6 根 -->
  <!-- L1 最低 -->
  <rect x="103" y="130" width="14" height="44" fill="url(#leadG)" stroke="#6f5710" stroke-width="1"/>
  <rect x="97" y="174" width="26" height="6" fill="#c8b07a" stroke="#6f5710" stroke-width="1"/>
  <!-- L2 略高 -->
  <rect x="148" y="130" width="14" height="40" fill="url(#leadG)" stroke="#6f5710" stroke-width="1"/>
  <rect x="142" y="170" width="26" height="6" fill="#c8b07a" stroke="#6f5710" stroke-width="1"/>
  <!-- L3 最低 -->
  <rect x="193" y="130" width="14" height="44" fill="url(#leadG)" stroke="#6f5710" stroke-width="1"/>
  <rect x="187" y="174" width="26" height="6" fill="#c8b07a" stroke="#6f5710" stroke-width="1"/>
  <!-- L4 最高（共面性偏差最大） -->
  <rect x="238" y="130" width="14" height="32" fill="url(#leadG)" stroke="#6f5710" stroke-width="1"/>
  <rect x="232" y="162" width="26" height="6" fill="#e08a6c" stroke="#a34a2e" stroke-width="1"/>
  <!-- L5 最低 -->
  <rect x="283" y="130" width="14" height="44" fill="url(#leadG)" stroke="#6f5710" stroke-width="1"/>
  <rect x="277" y="174" width="26" height="6" fill="#c8b07a" stroke="#6f5710" stroke-width="1"/>
  <!-- L6 略高 -->
  <rect x="328" y="130" width="14" height="41" fill="url(#leadG)" stroke="#6f5710" stroke-width="1"/>
  <rect x="322" y="171" width="26" height="6" fill="#c8b07a" stroke="#6f5710" stroke-width="1"/>

  <!-- 坐靠面 -->
  <line x1="72" y1="180" x2="376" y2="180" stroke="#4a8fd0" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="72" y="196" font-family="system-ui,sans-serif" font-size="12" fill="#4a8fd0">坐靠面（seating plane）</text>

  <!-- 三个最低点标记 -->
  <circle cx="110" cy="180" r="4" fill="#e06c6c"/>
  <circle cx="200" cy="180" r="4" fill="#e06c6c"/>
  <circle cx="290" cy="180" r="4" fill="#e06c6c"/>
  <text x="104" y="214" font-family="system-ui,sans-serif" font-size="11.5" fill="#e06c6c">①</text>
  <text x="194" y="214" font-family="system-ui,sans-serif" font-size="11.5" fill="#e06c6c">②</text>
  <text x="284" y="214" font-family="system-ui,sans-serif" font-size="11.5" fill="#e06c6c">③</text>

  <!-- 共面性偏差标注 -->
  <line x1="245" y1="168" x2="245" y2="180" stroke="#e06c6c" stroke-width="1.6" marker-start="url(#sgArrow)" marker-end="url(#sgArrow)"/>
  <line x1="252" y1="162" x2="268" y2="148" stroke="#e06c6c" stroke-width="1.2"/>
  <text x="272" y="146" font-family="system-ui,sans-serif" font-size="12" fill="#e06c6c">共面性偏差</text>

  <text x="24" y="240" font-family="system-ui,sans-serif" font-size="12.5" fill="#8b97a8">共面性 = 各引脚接触点相对坐靠面的最大正偏差（图示为示意放大）</text>
  <text x="24" y="259" font-family="system-ui,sans-serif" font-size="12.5" fill="#8b97a8">判据量级：消费级 ≤ 0.10 mm ｜ 细间距 / 车规 / QFN ≤ 0.05 mm</text>
  <text x="24" y="278" font-family="system-ui,sans-serif" font-size="12.5" fill="#8b97a8">产品等级越高，允许偏差越小；具体以对应 JEDEC 外形规范为准</text>

  <!-- ========== 右：弯曲应变 ========== -->
  <path d="M 440,72 L 560,72 A 48,48 0 0 1 608,120 L 608,245 L 584,245 L 584,120 A 24,24 0 0 0 560,96 L 440,96 Z"
        fill="url(#bandG)" stroke="#6f5710" stroke-width="1.5"/>
  <text x="462" y="89" font-family="system-ui,sans-serif" font-size="12" fill="#4a3a12">引脚材料（料厚 t）</text>

  <!-- 料厚标注 -->
  <line x1="448" y1="72" x2="448" y2="96" stroke="#4a8fd0" stroke-width="1.4" marker-start="url(#sgArrowG)" marker-end="url(#sgArrowG)"/>
  <text x="424" y="89" font-family="system-ui,sans-serif" font-size="12" fill="#4a8fd0" text-anchor="end">t</text>

  <!-- 半径标注 -->
  <line x1="560" y1="120" x2="586" y2="120" stroke="#9aa7b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="560" cy="120" r="2.6" fill="#9aa7b8"/>
  <text x="566" y="138" font-family="system-ui,sans-serif" font-size="12" fill="#8b97a8">R</text>
  <text x="616" y="150" font-family="system-ui,sans-serif" font-size="12" fill="#8b97a8">外侧受拉</text>
  <text x="616" y="168" font-family="system-ui,sans-serif" font-size="12" fill="#e06c6c">→ 起裂源</text>

  <text x="432" y="286" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#5d7699">ε = t / (2R + t)</text>
  <text x="432" y="306" font-family="system-ui,sans-serif" font-size="12" fill="#8b97a8">R = 1.0t → 33%　｜　R = 2.0t → 20%　｜　R = 4.5t → 10%</text>
  <text x="600" y="286" font-family="system-ui,sans-serif" font-size="12" fill="#8b97a8">铜合金延伸率 10%～15%</text>
  <text x="600" y="306" font-family="system-ui,sans-serif" font-size="12" fill="#8b97a8">→ 成型半径至少取 3～5t</text>
</svg>
